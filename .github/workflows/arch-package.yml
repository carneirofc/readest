# Fork build: build packaging/arch/PKGBUILD in an Arch Linux container and
# publish the package as a pacman repository on the rolling `arch-repo`
# release of carneirofc/readest. The PKGBUILD builds the upstream tag it
# names, so a run is only needed when the packaging changes. Pull requests
# that touch the packaging are built but not published.
#
# To install from it, add to /etc/pacman.conf (the package is unsigned):
#
#   [readest]
#   SigLevel = Optional TrustAll
#   Server = https://github.com/carneirofc/readest/releases/download/arch-repo
#
# and install it with `pacman -Sy readest-carneirofc` (it replaces `readest`).
name: Arch Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - packaging/arch/**
      - .github/workflows/arch-package.yml
  pull_request:
    paths:
      - packaging/arch/**
      - .github/workflows/arch-package.yml

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'carneirofc/readest'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: arch-package-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Next.js, cargo and CEF build trees do not fit in the runner's
      # default free space.
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker image prune --all --force
          df -h /

      # makepkg refuses to run as root, so the build runs as an unprivileged
      # user with passwordless sudo for --syncdeps. The .SRCINFO check fails
      # the run when the PKGBUILD was changed without regenerating it.
      - name: build the package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm \
            -v "$PWD/packaging/arch:/pkg" \
            -v "$RUNNER_TEMP/out:/out" \
            -w /pkg \
            -e PACKAGER="${{ github.repository }} CI <noreply@github.com>" \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git
              # sudo drops the environment, so hand PACKAGER over via makepkg.conf.
              echo "PACKAGER=\"$PACKAGER\"" >> /etc/makepkg.conf
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chown -R builder /pkg /out
              sudo -u builder bash -euo pipefail -c "
                makepkg --printsrcinfo | diff -u .SRCINFO -
                PKGDEST=/out makepkg --syncdeps --noconfirm --cleanbuild
              "
              cd /out
              repo-add readest.db.tar.gz ./*.pkg.tar.zst
              # Release assets cannot be symlinks.
              for link in readest.db readest.files; do
                cp --remove-destination "$(readlink -f "$link")" "$link"
              done
            '
          ls -l "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: readest-arch-repo
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 7

  # Recreated on every run so the repository only ever holds the latest build.
  # Not cancelled once started, so a newer run cannot interrupt it between
  # deleting the release and creating it again.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: arch-package-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: readest-arch-repo
          path: dist

      - name: publish the pacman repository
        run: |
          set -euo pipefail
          tag=arch-repo
          pkg=$(cd dist && ls *.pkg.tar.zst)
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/* \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "Arch Linux package: ${pkg%.pkg.tar.zst}" \
            --notes "$(cat <<EOF
          Arch Linux package built from \`packaging/arch/PKGBUILD\` at $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.

          Install the package directly with \`sudo pacman -U <url of $pkg>\`, or add the repository to \`/etc/pacman.conf\` (the package is unsigned):

          \`\`\`
          [readest]
          SigLevel = Optional TrustAll
          Server = $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag
          \`\`\`

          then run \`sudo pacman -Sy ${pkg%%-[0-9]*}\` (it replaces \`readest\`).
          EOF
          )"
          echo "Published $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
