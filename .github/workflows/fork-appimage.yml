# Fork build: publish the Linux CEF AppImage of feat/bookorbit-catalog as a
# rolling GitHub prerelease on carneirofc/readest. The build steps follow
# try-appimage.yml (kept in sync by hand); the differences are that updater
# artifacts are switched off, since the fork has no TAURI_SIGNING_PRIVATE_KEY,
# and that the AppImages are published instead of kept as workflow artifacts.
name: Fork AppImage

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bookorbit-catalog

concurrency:
  group: fork-appimage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appimage:
    if: github.repository == 'carneirofc/readest'
    strategy:
      fail-fast: false
      matrix:
        config:
          - os: ubuntu-22.04
            arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            arch: aarch64
            rust_target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: fork-appimage-${{ matrix.config.os }}-${{ matrix.config.arch }}-cargo

      # See try-appimage.yml for why the CLI comes from readest/tauri.
      - name: install the CEF tauri CLI from readest/tauri
        run: |
          set -euo pipefail
          rev=2b8315bd14882471b6567b1ceba84c0c0238f156
          marker="$HOME/.cargo/bin/.cargo-tauri-rev"
          if [ -x "$HOME/.cargo/bin/cargo-tauri" ] && [ "$(cat "$marker" 2>/dev/null)" = "$rev" ]; then
            echo "cargo-tauri at $rev already installed"
            exit 0
          fi
          cargo install tauri-cli --git https://github.com/readest/tauri --rev "$rev" --locked --force
          echo "$rev" > "$marker"

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libgtk-3-dev libwebkit2gtk-4.1 libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1 libjavascriptcoregtk-4.1-dev gir1.2-javascriptcoregtk-4.1 gir1.2-webkit2-4.1 libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # See try-appimage.yml for why these libraries are staged by hand.
      # Updater artifacts need TAURI_SIGNING_PRIVATE_KEY, which the fork
      # does not have, so they are turned off for this build.
      - name: stage CEF AppImage runtime libraries
        run: |
          set -euo pipefail
          sudo apt-get install -y libnss3 libpulse0 libspeechd2 libxkbcommon-x11-0
          nss_dir=$(dirname "$(ls /usr/lib/*-linux-gnu/nss/libsoftokn3.so)")
          lib_dir=${nss_dir%/nss}
          sudo cp -f --remove-destination "$nss_dir"/*.so "$lib_dir/"
          conf=apps/readest-app/src-tauri/tauri.conf.json
          jq --arg d "$lib_dir" '.bundle.createUpdaterArtifacts = false
            | .bundle.linux.appimage.files += {
              "/usr/lib/libspeechd.so.2": ($d + "/libspeechd.so.2"),
              "/usr/lib/libxkbcommon-x11.so.0": ($d + "/libxkbcommon-x11.so.0")
            }' "$conf" > "$conf.tmp" && mv "$conf.tmp" "$conf"

      # The analytics and sync secrets are optional: left unset, the
      # variables are empty and those features stay off.
      - name: create .env.local file for Next.js
        run: |
          echo "NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.local
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> .env.local
          cp .env.local apps/readest-app/.env.local

      - name: build the AppImage
        shell: bash
        timeout-minutes: 45
        env:
          TAURI_CEF_CARGO: '1'
          # See release.yml.
          STRACE_MODE: '0'
          # Baked in at compile time: the updater would otherwise replace
          # this build with upstream's signed release.
          READEST_DISABLE_UPDATER: '1'
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd apps/readest-app
          pnpm tauri build --bundles appimage

      - name: verify the AppImage bundle contents
        run: |
          set -euo pipefail
          lib=target/release/bundle/appimage/Readest.AppDir/lib
          for so in libsoftokn3.so libfreeblpriv3.so libnssckbi.so libsqlite3.so.0 \
                    libpulse.so.0 libspeechd.so.2 libxkbcommon-x11.so.0; do
            [ -e "$lib/$so" ] || { echo "::error::$so is missing from the AppImage bundle"; exit 1; }
          done
          ls "$lib"/pulseaudio/libpulsecommon-*.so > /dev/null 2>&1 \
            || { echo "::error::libpulsecommon is missing from the AppImage bundle"; exit 1; }
          grep -qx '+/pulseaudio' "$lib/lib.path" \
            || { echo "::error::lib.path does not cover lib/pulseaudio, so libpulse cannot load"; exit 1; }
          [ -e "${lib%/lib}/bin/00-no-userns-prompt.hook" ] \
            || { echo "::error::the no-userns-prompt hook is missing from the AppImage bundle"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Readest-AppImage-${{ matrix.config.arch }}
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  # One rolling prerelease per branch, recreated on every run so its tag
  # always points at the commit the AppImages were built from.
  publish:
    needs: appimage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: Readest-AppImage-*
          merge-multiple: true

      - name: publish the rolling prerelease
        run: |
          set -euo pipefail
          tag="appimage-${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA::7}"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" dist/*.AppImage \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "AppImage: $GITHUB_REF_NAME ($short_sha)" \
            --notes "Linux AppImage built from \`$GITHUB_REF_NAME\` at $GITHUB_SHA by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
